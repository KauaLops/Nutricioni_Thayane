spring:
  application:
    name: Thayane-Nutri
  config:
    # Carrega o arquivo .env (se existir) na raiz do projeto. Nunca versione o .env.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thayane_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # em produção prefira "validate" + Flyway/Liquibase
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  mail:
    destino: ${MAIL_DESTINO:nutrithayluize@gmail.com}
  admin:
    nome: ${ADMIN_NOME:Thayane Luíze}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_PASSWORD:}
