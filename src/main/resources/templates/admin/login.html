<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Entrar')}"></head>
<body class="login-page">
<main class="login-card">
  <img th:src="@{/images/logo.jpg}" alt="Thayane Luíze Nutricionista" width="140">
  <h1>Área administrativa</h1>
  <p class="alert err" role="alert" th:if="${param.erro}">E-mail ou senha incorretos.</p>
  <p class="alert ok" role="status" th:if="${param.logout}">Você saiu com segurança.</p>
  <form th:action="@{/admin/login}" method="post">
    <label for="email">E-mail ou usuário</label>
    <input id="email" name="email" type="text" required autocomplete="username" autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required autocomplete="current-password">
    <button class="btn" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
