<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Preços')}"></head>
<body>
<div class="layout">
<aside th:replace="~{fragments/admin :: sidebar('precos')}"></aside>
<main class="content">
  <h1>Serviços e preços</h1>
  <p class="alert ok" role="status" th:if="${msg}" th:text="${msg}"></p>
  <section class="panel">
    <h2 th:text="${form.id == null} ? 'Novo serviço' : 'Editar serviço'">Novo serviço</h2>
    <form th:action="@{/admin/precos/salvar}" th:object="${form}" method="post" class="form">
      <input type="hidden" th:field="*{id}">
      <label for="nome">Nome do serviço</label><input id="nome" th:field="*{nome}" maxlength="120"><small class="err" th:errors="*{nome}"></small>
      <label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" rows="2" maxlength="500"></textarea><small class="err" th:errors="*{descricao}"></small>
      <label for="preco">Preço (R$)</label><input id="preco" th:field="*{preco}" type="number" step="0.01" min="0"><small class="err" th:errors="*{preco}"></small>
      <label for="beneficios">Benefícios (um por linha)</label><textarea id="beneficios" th:field="*{beneficios}" rows="4" maxlength="1000"></textarea><small class="err" th:errors="*{beneficios}"></small>
      <label class="check"><input type="checkbox" th:field="*{ativo}"> Serviço ativo (visível no site)</label>
      <div class="row"><button class="btn" type="submit">Salvar serviço</button><a class="btn btn-ghost" th:href="@{/admin/precos}" th:if="${form.id != null}">Cancelar</a></div>
    </form>
  </section>
  <section class="panel">
    <h2>Cadastrados</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Serviço</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        <tr th:each="s : ${itens}">
          <td th:text="${s.nome}">Nome</td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(s.preco,1,'POINT',2,'COMMA')}">R$ 0,00</td>
          <td><span class="pill" th:classappend="${s.ativo} ? 'on' : 'off'" th:text="${s.ativo} ? 'Ativo' : 'Inativo'">Ativo</span></td>
          <td class="actions">
            <a class="btn btn-sm btn-ghost" th:href="@{/admin/precos(editar=${s.id})}">Editar</a>
            <form th:action="@{/admin/precos/{id}/alternar(id=${s.id})}" method="post"><button class="btn btn-sm btn-ghost" type="submit" th:text="${s.ativo} ? 'Desativar' : 'Ativar'">Desativar</button></form>
            <form th:action="@{/admin/precos/{id}/excluir(id=${s.id})}" method="post" data-confirm="Excluir este serviço?"><button class="btn btn-sm btn-danger" type="submit">Excluir</button></form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(itens)}"><td colspan="4">Nenhum serviço cadastrado.</td></tr>
      </tbody></table></div>
  </section>
</main>
</div>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
